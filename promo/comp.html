<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Diaru — showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&display=block" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────────
   Diaru 쇼릴 — 1920×1080 · 20초 · 60fps
   움직임은 CSS 애니메이션이 아니라 전부 REEL.seek(t) 가 세운다.
   프레임을 네 대가 나눠 찍어도 같은 그림이 나와야 하기 때문이다.
   ────────────────────────────────────────────────────────────── */
:root{
  --navy:#26354f; --ink:#2a3a57; --ivory:#fbf7ef; --paper:#fffdf7;
  --line:#e9e1d2; --gold:#c2994a; --sage:#8fa08a; --rose:#b1818b;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d1117}
body{font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}

#stage{position:absolute;inset:0;overflow:hidden;perspective:2200px;
  background:radial-gradient(ellipse at 50% 42%,#2a3346 0%,#141a26 48%,#0a0e16 100%)}
#desk{position:absolute;inset:-10%;background:
  radial-gradient(ellipse at 50% 38%,#ffffff14,transparent 58%),
  repeating-linear-gradient(97deg,#ffffff05 0 2px,transparent 2px 7px);pointer-events:none}
/* 카메라 — 장면 전체를 밀고 당긴다 */
#cam{position:absolute;inset:0;transform-origin:50% 50%;transform-style:preserve-3d;will-change:transform}

.layer{position:absolute;inset:0;opacity:0;will-change:opacity,transform}

/* ── 종이 ───────────────────────────────────────────── */
#paper{position:absolute;left:50%;top:50%;width:1460px;height:940px;margin:-470px -730px;
  background:var(--paper);border-radius:6px;overflow:hidden;
  box-shadow:0 80px 160px #00000066, 0 10px 30px #00000033, 0 1px 0 #fff6 inset;transform-origin:50% 50%}
#paper .fibers{position:absolute;inset:0;opacity:.85;
  background-image:radial-gradient(#8a7f6a26 1px,transparent 1.2px);background-size:7px 7px}
/* 가장자리로 갈수록 아주 조금 어두워져야 종이로 보인다 */
#paper .shade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 44%,transparent 46%,#8a7f6a1f 100%)}
#paper .fold{position:absolute;left:calc(50% - 26px);top:0;bottom:0;width:52px;
  background:linear-gradient(90deg,transparent,#7e736326 46%,#fff9 53%,transparent)}
#pattern{position:absolute;inset:0;--pu:1.1px}
#chrome{position:absolute;inset:0;color:#8c8676;font-size:26px}
#chrome span{position:absolute;text-align:center}
#chrome .sun{color:#b2827a}#chrome .sat{color:#7f8fa6}

/* ── 글자 ───────────────────────────────────────────── */
#wordmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
#wordmark svg{width:760px;height:300px;overflow:visible}
#wordmark path{fill:none;stroke:var(--navy);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.nib{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--navy);
  box-shadow:0 0 22px #26354f55;opacity:0}

.chip{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:14px 28px;border-radius:30px;
  background:#1b2436cc;backdrop-filter:blur(8px);color:#fdfaf4;font-size:25px;font-weight:300;letter-spacing:.5px;
  opacity:0;white-space:nowrap}
.chip b{font-weight:600;color:#f1d79a}

/* ── 스티커 ─────────────────────────────────────────── */
.sticker{position:absolute;width:112px;height:112px;background-size:400% 400%;
  will-change:transform,opacity;transform-origin:50% 50%}

/* ── 사진 ───────────────────────────────────────────── */
.shot{position:absolute;background:#fff;padding:12px 12px 34px;
  box-shadow:0 18px 40px #0000002e;will-change:transform,opacity}
.shot img{width:100%;height:100%;object-fit:cover;display:block}

/* ── 손글씨 ─────────────────────────────────────────── */
#handwriting{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1240px;height:430px}
#handwriting svg{width:100%;height:100%;overflow:visible}

/* ── 친구 ───────────────────────────────────────────── */
.card{position:absolute;background:var(--ivory);border-radius:22px;padding:26px 28px;
  box-shadow:0 30px 60px #00000038;will-change:transform,opacity}
.card .who{display:flex;align-items:center;gap:14px;font-size:24px;color:var(--navy);font-weight:600}
.card .face{width:46px;height:46px;border-radius:50%;background:#e7e2d6;overflow:hidden}
.card .face img{width:100%;height:100%;object-fit:cover}
.card .bubble{margin-top:18px;background:#fff;border-radius:16px;padding:16px 20px;font-size:23px;color:#4a5569;
  box-shadow:0 4px 14px #0000000f;min-width:360px}
.heart{position:absolute;color:var(--rose);font-size:70px;opacity:0;will-change:transform,opacity}
.ring{position:absolute;border:4px solid var(--rose);border-radius:50%;opacity:0}

/* ── 기기 ───────────────────────────────────────────── */
#phone{position:absolute;left:50%;top:50%;width:430px;height:900px;margin:-450px -215px;
  background:#fdfaf4;border-radius:52px;overflow:hidden;border:10px solid #141a24;
  box-shadow:0 60px 120px #00000066;opacity:0;will-change:transform,opacity}
#phone img{width:100%;height:100%;object-fit:cover;object-position:top center}

/* ── 끝 ─────────────────────────────────────────────── */
#lockup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0}
#lockup .mark{width:190px;height:190px;border-radius:44px;display:grid;place-items:center;
  background:linear-gradient(150deg,#fdfaf4,#f0e7d7);box-shadow:0 30px 70px #0006}
#lockup .mark span{font-family:'Nanum Pen Script';font-size:150px;color:var(--navy);line-height:1;margin-top:14px}
#lockup h1{font-family:'Nanum Pen Script';font-size:92px;color:#fdfaf4;letter-spacing:2px;font-weight:400}
#lockup p{font-size:26px;color:#b9c2d0;letter-spacing:10px;margin-top:-10px}
#lockup .url{font-size:20px;color:#7b8699;letter-spacing:1px;margin-top:22px;opacity:0}

.spark{position:absolute;color:var(--gold);opacity:0;will-change:transform,opacity;pointer-events:none}

/* ── 마감 ───────────────────────────────────────────── */
#fx{position:absolute;inset:0;pointer-events:none}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%,transparent 52%,#00000055 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
#bars{position:absolute;inset:0;pointer-events:none}
#bars i{position:absolute;left:0;right:0;height:0;background:#0b0f16}
</style>
</head>
<body>
<div id="stage">
  <div id="desk"></div>
  <div id="cam">
    <!-- 종이 -->
    <div class="layer" id="L-paper">
      <div id="paper">
        <div class="fibers"></div>
        <div class="shade"></div>
        <div id="pattern"></div>
        <div id="chrome"></div>
        <div class="fold" id="fold"></div>
        <div id="shots"></div>
        <div id="handwriting"><div class="nib" id="handNib"></div></div>
      </div>
    </div>
    <div class="layer" id="L-stickers"><div id="stickers"></div></div>
    <!-- 글자 -->
    <div class="layer" id="L-word">
      <div id="wordmark">
        <svg viewBox="0 0 760 300" aria-hidden="true"><path id="wm" d=""/></svg>
        <div class="nib" id="nib"></div>
      </div>
    </div>
    <!-- 친구 -->
    <div class="layer" id="L-friends">
      <div class="card" id="cardA" style="left:1046px;top:610px;width:600px">
        <div class="who"><span class="face"><img id="faceA" alt=""></span><b>@someone</b></div>
        <div class="bubble" id="bubbleA"></div>
      </div>
      <div class="heart" id="heart">♥</div>
      <div class="ring" id="ring"></div>
    </div>
    <!-- 기기 -->
    <div id="phone"><img id="phoneShot" alt=""></div>
  </div>

  <div id="lockup">
    <div class="mark"><span>D</span></div>
    <h1>Diaru<i style="font-family:serif;font-style:normal;font-size:44px;color:#c2994a;vertical-align:42px;margin-left:12px">✦</i></h1>
    <p>오늘의 조각</p>
    <div class="url" id="url">diaru.64-227-141-147.sslip.io</div>
  </div>

  <div class="chip" id="chip"><b id="chipNum"></b><span id="chipText"></span></div>
  <div id="sparks"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div id="bars"><i style="top:0"></i><i style="bottom:0"></i></div>
  <div id="flash"></div>
</div>

<script src="reel.js"></script>
</body>
</html>
